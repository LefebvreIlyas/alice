name: alice_dio
description: "Alice + Dio integration. It contains plugin for Alice which allows to use Dio package."
version: 1.0.7
repository: https://github.com/jhomlala/alice
homepage: https://github.com/jhomlala/alice
resolution: workspace
topics:
  - http
  - inspector
  - dio
  - interceptor
  - alice

environment:
  sdk: '>=3.10.0 <4.0.0'

  flutter: '>=3.38.0'

dependencies:
  alice: ^1.0.0-dev.13
  dio: ^5.9.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  test: ^1.26.3
  mocktail: ^1.0.4
  http_mock_adapter: ^0.6.1
  alice_test: ^1.0.0