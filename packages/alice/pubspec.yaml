name: alice
description: Alice is an HTTP Inspector tool which helps debugging http requests. It catches and stores http requests and responses, which can be viewed via simple UI.
version: 1.0.0
homepage: https://github.com/jhomlala/alice
repository: https://github.com/jhomlala/alice
topics:
  - http
  - inspector
  - dio
  - chopper
  - interceptor

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.2.0
  rxdart: ^0.28.0
  path_provider: ^2.1.6
  permission_handler: ^12.0.3
  package_info_plus: ^10.2.1
  open_filex: ^4.7.0
  sensors_plus: ^7.1.0
  share_plus: ^13.3.0
  collection: ^1.19.1
  url_launcher: ^6.3.2
  equatable: ^2.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  lints: ^6.1.0
  test: ^1.31.0
  mocktail: ^1.0.4