name: alice_chopper_example
description: "Alice + Chopper Example"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+3

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  alice:
  alice_chopper:
  chopper: ^8.7.0
  json_annotation: ^4.12.0
  equatable: ^2.1.0

dev_dependencies:
  build_runner: ^2.15.2
  chopper_generator: ^8.7.0
  json_serializable: ^6.14.0
  flutter_lints: ^6.0.0
  lints: ^6.1.0

dependency_overrides:
  alice:
    path: ../../packages/alice
  alice_chopper:
    path: ../../packages/alice_chopper

flutter:
  uses-material-design: true
